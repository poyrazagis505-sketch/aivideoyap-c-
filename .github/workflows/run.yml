name: AI Video Fabrikasi Botu

on:
  workflow_dispatch:

jobs:
  render_video:
    runs-on: ubuntu-latest
    steps:
      - name: Repo dosyalarini indir
        uses: actions/checkout@v4

      - name: Python ortamini kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gereksinimleri yukle
        run: |
          pip install --upgrade pip
          pip install requests gTTS moviepy

      - name: main.py calistir ve videoyu uret
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python main.py
